{% if project_photos %}
<section class="project-gallery" id="gallery" aria-labelledby="gallery-title">
  <h2 class="section-kicker reveal" id="gallery-title">PROJECT GALLERY</h2>
  <i class="section-rule reveal" aria-hidden="true"></i>
  <div class="gallery-viewport reveal">
    <div class="gallery-track{% if project_photos|length == 1 %} gallery-track-single{% endif %}">
      {% for photo in project_photos %}
      <figure><img src="{{ photo.image.url }}" alt="{{ photo.alt_text }}" loading="lazy" tabindex="0" role="button" aria-label="Enlarge {{ photo.alt_text }}"></figure>
      {% endfor %}
      {% if project_photos|length > 1 %}
      {% for photo in project_photos %}
      <figure aria-hidden="true"><img src="{{ photo.image.url }}" alt="" loading="lazy"></figure>
      {% endfor %}
      {% endif %}
    </div>
  </div>
</section>
<div class="gallery-lightbox" role="dialog" aria-modal="true" aria-label="Project image preview" hidden><button class="gallery-lightbox-close" type="button" aria-label="Close image preview"><i class="bi bi-x-lg" aria-hidden="true"></i></button><img src="" alt=""></div>
{% endif %}
