{% extends "base.html" %}
{% block title %}Page Not Found | CEC{% endblock %}
{% block meta_description %}<meta name="description" content="The page you are looking for does not exist.">{% endblock %}
{% block content %}
<main>
  <section class="error-page" style="min-height:60vh;display:flex;align-items:center;justify-content:center;">
    <div class="container text-center">
      <h1 style="font-size:6rem;font-weight:700;color:var(--cec-navy);">404</h1>
      <p style="font-size:1.25rem;color:#6c757d;margin-bottom:2rem;">The page you're looking for doesn't exist or has been moved.</p>
      <a href="{% url 'core:home' %}" class="btn btn-primary">Back to Home</a>
    </div>
  </section>
</main>
{% endblock %}
